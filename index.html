<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>宝可梦 × 文明 — 原野图鉴</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">野</div><div><strong>宝可梦 × 文明</strong><small>原野图鉴 · M2 城市经济</small><p id="map-info" role="status">正在生成地图…</p></div></div>
        <div class="round-block"><small>当前轮次</small><strong id="round-display">— <span>/ 100</span></strong></div>
        <div class="hud-resources" aria-label="资源总览">
          <div class="resource"><small>金币</small><strong id="hud-gold">—</strong></div>
          <div class="resource"><small>科研</small><strong id="hud-research">—</strong></div>
          <div class="resource"><small>维护</small><strong id="hud-upkeep">—</strong></div>
        </div>
        <button id="end-turn" class="primary">结束回合　›</button>
      </header>

      <div class="workspace">
        <div class="map-column">
          <section class="map-card" aria-label="主地图">
            <div class="map-toolbar"><strong>青绿原野</strong><span class="map-meta">小地图 · 24 × 16</span><div class="map-actions"><button id="fit">F 地图居中</button><label><input id="animate" type="checkbox" checked />移动动画</label><button id="skip" disabled>跳过动画</button></div></div>
            <figure class="map-frame">
              <canvas id="map" tabindex="0" aria-label="六角格地图。点击或用方向键选择，Enter 确认，Escape 取消，加减缩放，F 居中"></canvas>
              <figcaption><span>色块字母 = 宝可梦简称　数字 1–4 = 文明　斜线 = 记忆地形</span><span>点选单位 → 高亮格移动</span></figcaption>
            </figure>
          </section>
          <p id="selection" aria-live="polite">点选己方单位；拖动地图平移，滚轮缩放。</p>
          <section id="unit-panel" aria-label="单位面板"></section>
          <ul id="legend" aria-label="群系图例"></ul>
        </div>
        <aside class="side-column">
          <section id="economy" aria-label="城市与经济"></section>
        </aside>
      </div>

      <section id="controls" aria-label="游戏与存档控制">
        <label>御三家 <select id="starter"><option value="bulbasaur">妙蛙种子</option><option value="charmander">小火龙</option><option value="squirtle">杰尼龟</option></select></label>
        <button id="new-game">新游戏</button>
        <button id="save-game">保存</button><button id="load-game">读档</button><button id="export-save">导出存档 JSON</button>
        <label>导入存档 <input id="import-save" type="file" accept="application/json,.json"></label>
      </section>

      <details id="dev-drawer">
        <summary>开发、命令回放与调试</summary>
        <div class="dev-content">
          <label id="god-label"><input id="god" type="checkbox" />上帝视角（开发）</label>
          <button id="export">导出命令 JSON</button>
          <label>重放序号 <input id="sequence" type="number" min="0" value="0" /></label>
          <button id="replay">重放</button><button id="resume">从此处继续</button>
          <pre id="debug" aria-label="调试状态"></pre>
        </div>
      </details>
      <details id="keyboard-help"><summary>键盘操作</summary><p>Tab 切换控件；地图方向键移动光标；Enter 选择/移动；Esc 取消；+ / − 缩放；F 居中；C 城市；R 研究；Ctrl+Enter 结束回合。</p></details>
    </main>
    <script type="module" src="/src/browser/main.ts"></script>
  </body>
</html>
