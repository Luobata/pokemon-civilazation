<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容编辑器 · 宝可梦 × 文明</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/editor.css">
</head>
<body>
<aside id="startup-notice" role="status" style="margin:16px;padding:16px;border:1px solid #b78c44;border-radius:10px;background:#fff4da;color:#342a18;font:16px/1.6 sans-serif">
  <strong>页面正在启动</strong>
  <p>如果此提示持续显示，请通过本地服务打开页面。直接预览 HTML 文件无法运行游戏。</p>
  <a href="http://127.0.0.1:5173/editor.html" style="color:#175f51">打开本地运行页面 ↗</a>
  <details><summary>启动方式</summary><p>在项目目录运行 <code>npm run dev -- --host 127.0.0.1 --port 5173 --strictPort</code>；联机时另开终端运行 <code>npm run server</code>。如果服务已启动，请使用终端显示的地址。服务正常但页面仍未启动时，请刷新页面并检查浏览器控制台。</p></details>
</aside>
<main class="editor-shell">
  <aside class="editor-aside">
    <div><h1>内容编辑器</h1><p>深拷贝、校验、导出，并在隔离引擎中试跑。</p></div>
    <div class="editor-actions">
      <button id="load-baseline" type="button">载入基线</button>
      <label class="editor-label">导入 JSON<input id="import-content" type="file" accept="application/json,.json"></label>
      <button id="validate-content" type="button">校验并应用</button>
      <button id="export-content" type="button">导出</button>
    </div>
    <p id="editor-notice" role="status">已载入生产内容基线。</p>
    <p id="validation-result"></p>
    <div><span class="editor-label">隔离模拟</span><div class="editor-actions"><button id="reset-simulation" type="button">重置</button><button id="run-turn" type="button">结束当前回合</button></div></div>
    <p id="simulation-result"></p>
  </aside>
  <section class="editor-main">
    <label class="editor-label" for="content-editor">完整内容 JSON（物种 / 建筑 / 科技 / 精灵球 / 平衡）</label>
    <textarea id="content-editor" spellcheck="false"></textarea>
    <div style="margin-top:12px"><label class="editor-label" for="simulation-action">高级命令 JSON（只影响隔离沙箱）</label>
      <textarea id="simulation-action" spellcheck="false"></textarea>
      <div class="editor-actions" style="margin-top:8px"><button id="run-action" type="button">执行命令</button></div>
    </div>
  </section>
</main>
<script type="module" src="/src/browser/editor.ts"></script>
</body>
</html>
