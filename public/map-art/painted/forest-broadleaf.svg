<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 340" width="260" height="340">
  <!-- Map-art option A (docs/design/map-art-options.md): a broadleaf wood. Original artwork made for pokemon-civilazation (no third-party sources; same standing as public/buildings/).
       Tile frame: R = 100, tile centre (130, 230), squash 0.8; the hex spans x 43–217, y 150–310. Light from the north-west. -->
  <defs>
    <linearGradient id="bark" x1="0" x2="1"><stop offset="0" stop-color="#9A7046"/><stop offset=".45" stop-color="#6E4B2B"/><stop offset="1" stop-color="#3B2716"/></linearGradient>
    <radialGradient id="floor" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#25401C" stop-opacity=".62"/><stop offset=".7" stop-color="#2E4E22" stop-opacity=".38"/><stop offset="1" stop-color="#2E4E22" stop-opacity="0"/></radialGradient>
    <path id="oak-crown" d="M-22-36a10 10 0 0 1 4-16a11 11 0 0 1 14-10a12 12 0 0 1 19 2a10 10 0 0 1 8 14a10 10 0 0 1-2 16a10 10 0 0 1-14 8a11 11 0 0 1-16 0a10 10 0 0 1-13-14z"/>
    <clipPath id="oak-clip"><use href="#oak-crown" xlink:href="#oak-crown"/></clipPath>
    <symbol id="oak" overflow="visible">
      <ellipse cx="10" cy="1" rx="24" ry="7" fill="#1A140C" opacity=".3"/>
      <path d="M-5.5 1Q-2.4-8-2.6-26H2.6Q2.4-8 5.5 1Q0 2.8-5.5 1Z" fill="url(#bark)" stroke="#2B1E10" stroke-width="1.5" stroke-linejoin="round"/>
      <use href="#oak-crown" xlink:href="#oak-crown" fill="#2B1E10" stroke="#2B1E10" stroke-width="4.5" stroke-linejoin="round"/>
      <use href="#oak-crown" xlink:href="#oak-crown" style="fill:var(--leaf-dark,#2E5B2A)"/>
      <g clip-path="url(#oak-clip)">
        <use href="#oak-crown" xlink:href="#oak-crown" transform="translate(-4 -5) translate(0 -42) scale(.84) translate(0 42)" style="fill:var(--leaf-mid,#4F8A38)"/>
        <g style="fill:var(--leaf-light,#8DBF4E)" opacity=".9"><circle cx="-14" cy="-50" r="7"/><circle cx="-2" cy="-57" r="7.5"/><circle cx="11" cy="-56" r="5.5"/><circle cx="-19" cy="-38" r="5"/></g>
        <g style="fill:var(--leaf-hi,#CBE37E)"><circle cx="-16" cy="-53" r="2.6"/><circle cx="-4" cy="-60" r="2.8"/><circle cx="9" cy="-59" r="2"/></g>
        <path d="M3-29q6-1 9-7M-9-26q5 0 8-5M12-43q5-1 7-6M-2-38q4 1 7-2" fill="none" stroke="#1C3618" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M-12-44q2-2 4.5-1M-1-49q2-2 4.5-1M-21-44q2-2 4-1M4-52q2-2 4-1" fill="none" stroke="#EAF5B0" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="bush" overflow="visible">
      <ellipse cx="5" cy="1" rx="13" ry="4" fill="#1A140C" opacity=".28"/>
      <path d="M-11 0a6 6 0 0 1 2-9a7 7 0 0 1 10-5a6.5 6.5 0 0 1 10 4a5.5 5.5 0 0 1 0 10z" fill="#3A6B2E" stroke="#2B1E10" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-8-6a5 5 0 0 1 8-6a5 5 0 0 1 6 2" fill="none" stroke="#9CC65A" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
  </defs>
  <!-- Forest floor: one dark mass under the canopy so the wood reads as a wood, not as scattered trees. -->
  <ellipse cx="132" cy="236" rx="96" ry="72" fill="url(#floor)"/>
  <g>
    <use href="#oak" xlink:href="#oak" transform="translate(108 180) scale(.8)" style="--leaf-dark:#3D6B2B;--leaf-mid:#6A9E3D;--leaf-light:#A9CC59;--leaf-hi:#E0EC8E"/>
    <use href="#oak" xlink:href="#oak" transform="translate(154 177) scale(.82)"/>
    <use href="#oak" xlink:href="#oak" transform="translate(80 203) scale(.85)" style="--leaf-dark:#24502C;--leaf-mid:#3F7F3C;--leaf-light:#79B04E;--leaf-hi:#B8DB7A"/>
    <use href="#oak" xlink:href="#oak" transform="translate(131 199) scale(.88)" style="--leaf-dark:#3D6B2B;--leaf-mid:#6A9E3D;--leaf-light:#A9CC59;--leaf-hi:#E0EC8E"/>
    <use href="#oak" xlink:href="#oak" transform="translate(180 205) scale(.84)"/>
    <use href="#oak" xlink:href="#oak" transform="translate(101 228) scale(.9)"/>
    <use href="#oak" xlink:href="#oak" transform="translate(154 226) scale(.92)" style="--leaf-dark:#24502C;--leaf-mid:#3F7F3C;--leaf-light:#79B04E;--leaf-hi:#B8DB7A"/>
    <use href="#oak" xlink:href="#oak" transform="translate(200 236) scale(.78)" style="--leaf-dark:#3D6B2B;--leaf-mid:#6A9E3D;--leaf-light:#A9CC59;--leaf-hi:#E0EC8E"/>
    <use href="#oak" xlink:href="#oak" transform="translate(70 254) scale(.84)" style="--leaf-dark:#3D6B2B;--leaf-mid:#6A9E3D;--leaf-light:#A9CC59;--leaf-hi:#E0EC8E"/>
    <use href="#oak" xlink:href="#oak" transform="translate(124 256) scale(.95)"/>
    <use href="#oak" xlink:href="#oak" transform="translate(174 258) scale(.88)" style="--leaf-dark:#24502C;--leaf-mid:#3F7F3C;--leaf-light:#79B04E;--leaf-hi:#B8DB7A"/>
    <use href="#oak" xlink:href="#oak" transform="translate(99 284) scale(.9)" style="--leaf-dark:#24502C;--leaf-mid:#3F7F3C;--leaf-light:#79B04E;--leaf-hi:#B8DB7A"/>
    <use href="#oak" xlink:href="#oak" transform="translate(150 286) scale(.93)" style="--leaf-dark:#3D6B2B;--leaf-mid:#6A9E3D;--leaf-light:#A9CC59;--leaf-hi:#E0EC8E"/>
    <use href="#bush" xlink:href="#bush" transform="translate(124 303) scale(.95)"/>
    <use href="#bush" xlink:href="#bush" transform="translate(186 290) scale(.8)"/>
    <use href="#bush" xlink:href="#bush" transform="translate(64 276) scale(.75)"/>
  </g>
</svg>
