<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 340" width="260" height="340">
  <!-- Map-art option A (docs/design/map-art-options.md): grassy hills. Original artwork made for pokemon-civilazation (no third-party sources; same standing as public/buildings/).
       Tile frame: R = 100, tile centre (130, 230), squash 0.8; the hex spans x 43-217, y 150-310. Light from the north-west. -->
